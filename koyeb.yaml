# Koyeb Deployment Configuration
# This file helps Koyeb understand how to deploy your backend

app:
  name: interview-ai-backend
  
services:
  - name: backend
    # Buildpack deployment (no Docker required)
    build:
      type: buildpack
      buildpack:
        run_command: "python python/start_server.py"
    
    # Service configuration
    instance:
      type: nano  # Free tier (512 MB RAM)
    
    ports:
      - port: 8000
        protocol: http
    
    # Environment variables (set these in Koyeb dashboard)
    env:
      - name: CLOUD_MODE
        value: "true"
      - name: PORT
        value: "8000"
      - name: HOST
        value: "0.0.0.0"
      - name: ALLOWED_ORIGINS
        value: "*"
      
      # Add these API keys in Koyeb dashboard (don't commit them here!)
      # - name: OPENAI_API_KEY
      # - name: DEEPGRAM_API_KEY
      # - name: DEFAULT_LLM
    
    # Health check
    health_checks:
      - http:
          port: 8000
          path: /health
    
    # Regions (choose one)
    regions:
      - was  # Washington, D.C. (US East)
      # - fra  # Frankfurt (EU West)
      # - sin  # Singapore (Asia)
    
    # Scaling
    scaling:
      min: 1
      max: 1
    
    # Auto-deploy on git push
    auto_deploy: true
