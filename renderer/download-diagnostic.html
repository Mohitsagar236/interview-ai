<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Download Button Diagnostic</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin: 0 0 10px 0;
        }
        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }
        .test-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin: 8px;
            transition: transform 0.2s;
        }
        .test-btn:hover {
            transform: translateY(-2px);
        }
        .test-btn:active {
            transform: translateY(0);
        }
        .test-btn.success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        .test-btn.danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.8;
        }
        .status.success {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }
        .status.info {
            background: #d1ecf1;
            border: 2px solid #17a2b8;
            color: #0c5460;
        }
        .status.warning {
            background: #fff3cd;
            border: 2px solid #ffc107;
            color: #856404;
        }
        code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            color: #d63384;
        }
        .step {
            background: #f8f9fa;
            padding: 12px;
            border-left: 4px solid #667eea;
            margin: 8px 0;
            border-radius: 4px;
        }
        .log-area {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .log-entry {
            margin: 4px 0;
            padding: 4px;
        }
        .log-error { color: #f48771; }
        .log-success { color: #89d185; }
        .log-info { color: #6796e6; }
        .log-warn { color: #dcdcaa; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔍 Download Button Diagnostic Tool</h1>
        <p class="subtitle">Let's figure out why the download buttons aren't working</p>
    </div>

    <div class="card">
        <h2>Step 1: Check API Availability</h2>
        <button class="test-btn" onclick="step1()">▶ Test API Connection</button>
        <div id="step1Result"></div>
    </div>

    <div class="card">
        <h2>Step 2: Check File Existence</h2>
        <button class="test-btn success" onclick="step2()">▶ Check Files</button>
        <div id="step2Result"></div>
    </div>

    <div class="card">
        <h2>Step 3: Test Download Function</h2>
        <button class="test-btn" onclick="testDownload('portable')">📦 Test Portable Download</button>
        <button class="test-btn success" onclick="testDownload('installer')">💿 Test Installer Download</button>
        <div id="step3Result"></div>
    </div>

    <div class="card">
        <h2>Step 4: Check Dashboard Buttons</h2>
        <button class="test-btn danger" onclick="step4()">▶ Inspect Dashboard Buttons</button>
        <div id="step4Result"></div>
    </div>

    <div class="card">
        <h2>📋 Live Console Log</h2>
        <div class="log-area" id="logArea"></div>
        <button class="test-btn" onclick="clearLog()">Clear Log</button>
    </div>

    <script>
        let logs = [];

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const entry = { timestamp, message, type };
            logs.push(entry);
            
            const logArea = document.getElementById('logArea');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.textContent = `[${timestamp}] ${message}`;
            logArea.appendChild(logEntry);
            logArea.scrollTop = logArea.scrollHeight;
            
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function clearLog() {
            logs = [];
            document.getElementById('logArea').innerHTML = '';
            log('Log cleared', 'info');
        }

        function showResult(elementId, html, type) {
            document.getElementById(elementId).innerHTML = `<div class="status ${type}">${html}</div>`;
        }

        function step1() {
            log('Starting API availability check...', 'info');
            showResult('step1Result', '⏳ Checking...', 'info');

            try {
                if (typeof window.electronAPI === 'undefined') {
                    log('FAILED: window.electronAPI is undefined', 'error');
                    showResult('step1Result', 
                        '❌ <strong>CRITICAL ERROR:</strong> window.electronAPI is not defined<br><br>' +
                        '<strong>This means:</strong><br>' +
                        '• preload.js is not loading<br>' +
                        '• Context bridge is not set up<br>' +
                        '• App needs to be restarted<br><br>' +
                        '<strong>Solution:</strong> Close app, run <code>npm start</code>', 
                        'error'
                    );
                    return;
                }

                log('electronAPI found', 'success');

                if (typeof window.electronAPI.downloadCompactBar !== 'function') {
                    log('FAILED: downloadCompactBar function not found', 'error');
                    showResult('step1Result', 
                        '❌ <strong>ERROR:</strong> downloadCompactBar function is missing<br><br>' +
                        '<strong>Available methods:</strong> ' + Object.keys(window.electronAPI).join(', ') + '<br><br>' +
                        '<strong>Solution:</strong> Restart app with <code>npm start</code>', 
                        'error'
                    );
                    return;
                }

                log('downloadCompactBar function found', 'success');
                log('API check PASSED ✓', 'success');
                
                showResult('step1Result', 
                    '✅ <strong>SUCCESS!</strong> API is fully available<br><br>' +
                    '• <code>window.electronAPI</code> ✓<br>' +
                    '• <code>downloadCompactBar</code> function ✓<br><br>' +
                    'You can proceed to Step 2!', 
                    'success'
                );

            } catch (error) {
                log(`Exception: ${error.message}`, 'error');
                showResult('step1Result', 
                    `❌ <strong>ERROR:</strong> ${error.message}`, 
                    'error'
                );
            }
        }

        async function step2() {
            log('Starting file existence check...', 'info');
            showResult('step2Result', '⏳ Checking files...', 'info');

            try {
                if (!window.electronAPI || !window.electronAPI.downloadCompactBar) {
                    log('API not available - run Step 1 first', 'warn');
                    showResult('step2Result', 
                        '⚠️ Complete Step 1 first!', 
                        'warning'
                    );
                    return;
                }

                log('Attempting to call downloadCompactBar...', 'info');
                const result = await window.electronAPI.downloadCompactBar('portable');
                log(`Received response: ${JSON.stringify(result)}`, 'info');

                if (result.needsBuild) {
                    log('Files are MISSING - need to build', 'error');
                    showResult('step2Result', 
                        '❌ <strong>FILES MISSING:</strong><br><br>' +
                        result.error + '<br><br>' +
                        '<strong>Run:</strong> <code>build-compact-bar.bat</code>', 
                        'error'
                    );
                } else if (result.error === 'Cancelled') {
                    log('File check successful (cancelled by user)', 'success');
                    showResult('step2Result', 
                        '✅ <strong>FILES EXIST!</strong><br><br>' +
                        'The save dialog appeared, which means files are ready.<br>' +
                        'You clicked Cancel - that\'s fine!<br><br>' +
                        'Proceed to Step 3!', 
                        'success'
                    );
                } else if (result.success) {
                    log('File saved successfully', 'success');
                    showResult('step2Result', 
                        '✅ <strong>FILES EXIST AND DOWNLOAD WORKS!</strong><br><br>' +
                        `File saved to: <code>${result.path}</code><br><br>' +
                        'The download function is working perfectly!', 
                        'success'
                    );
                } else {
                    log(`Unexpected result: ${JSON.stringify(result)}`, 'warn');
                    showResult('step2Result', 
                        `⚠️ Unexpected response: ${result.error || 'Unknown'}`, 
                        'warning'
                    );
                }

            } catch (error) {
                log(`Exception: ${error.message}`, 'error');
                showResult('step2Result', 
                    `❌ <strong>ERROR:</strong> ${error.message}`, 
                    'error'
                );
            }
        }

        async function testDownload(type) {
            const typeName = type === 'portable' ? 'Portable' : 'Installer';
            log(`Testing ${typeName} download...`, 'info');
            showResult('step3Result', `⏳ Requesting ${typeName} download...<br><br><strong>Watch for save dialog!</strong>`, 'info');

            try {
                if (!window.electronAPI || !window.electronAPI.downloadCompactBar) {
                    log('API not available', 'error');
                    showResult('step3Result', '❌ API not available. Complete Step 1 first!', 'error');
                    return;
                }

                log(`Calling downloadCompactBar('${type}')`, 'info');
                const result = await window.electronAPI.downloadCompactBar(type);
                log(`Response: ${JSON.stringify(result)}`, 'info');

                if (result.success) {
                    log(`Download successful: ${result.path}`, 'success');
                    showResult('step3Result', 
                        `✅ <strong>${typeName} DOWNLOAD SUCCESSFUL!</strong><br><br>` +
                        `<strong>Saved to:</strong><br><code>${result.path}</code><br><br>` +
                        '• File copied ✓<br>' +
                        '• Folder opened ✓<br>' +
                        '• Download works perfectly! ✓', 
                        'success'
                    );
                } else if (result.needsBuild) {
                    log('Files not built', 'error');
                    showResult('step3Result', 
                        `❌ <strong>FILES NOT BUILT:</strong><br><br>${result.error}`, 
                        'error'
                    );
                } else if (result.error === 'Cancelled') {
                    log('User cancelled download', 'info');
                    showResult('step3Result', 
                        'ℹ️ <strong>Download Cancelled</strong><br><br>' +
                        'You clicked Cancel in the save dialog.<br><br>' +
                        '<strong>Good news:</strong> The button IS working!<br>' +
                        'Try again and actually save to test fully.', 
                        'info'
                    );
                } else {
                    log(`Download failed: ${result.error}`, 'error');
                    showResult('step3Result', 
                        `❌ <strong>ERROR:</strong> ${result.error || 'Unknown error'}`, 
                        'error'
                    );
                }

            } catch (error) {
                log(`Exception: ${error.message}`, 'error');
                showResult('step3Result', 
                    `❌ <strong>EXCEPTION:</strong> ${error.message}<br><br>` +
                    'Check the Live Console Log below for details.', 
                    'error'
                );
            }
        }

        function step4() {
            log('Inspecting Dashboard buttons...', 'info');
            showResult('step4Result', '⏳ Checking...', 'info');

            try {
                const portableBtn = document.getElementById('downloadPortable');
                const installerBtn = document.getElementById('downloadInstaller');

                let html = '<strong>Button Inspection Results:</strong><br><br>';

                if (portableBtn) {
                    log('Found downloadPortable button', 'success');
                    html += '✅ <code>downloadPortable</code> button found<br>';
                    html += `   • ID: ${portableBtn.id}<br>`;
                    html += `   • Text: ${portableBtn.textContent.trim()}<br>`;
                    html += `   • Visible: ${portableBtn.offsetParent !== null}<br>`;
                    html += `   • Disabled: ${portableBtn.disabled}<br><br>`;
                } else {
                    log('downloadPortable button NOT FOUND', 'error');
                    html += '❌ <code>downloadPortable</code> button NOT FOUND<br><br>';
                }

                if (installerBtn) {
                    log('Found downloadInstaller button', 'success');
                    html += '✅ <code>downloadInstaller</code> button found<br>';
                    html += `   • ID: ${installerBtn.id}<br>`;
                    html += `   • Text: ${installerBtn.textContent.trim()}<br>`;
                    html += `   • Visible: ${installerBtn.offsetParent !== null}<br>`;
                    html += `   • Disabled: ${installerBtn.disabled}<br><br>`;
                } else {
                    log('downloadInstaller button NOT FOUND', 'error');
                    html += '❌ <code>downloadInstaller</code> button NOT FOUND<br><br>';
                }

                if (!portableBtn && !installerBtn) {
                    html += '<strong>Problem:</strong> You\'re on the wrong page!<br>';
                    html += 'Go to <strong>Dashboard</strong> or <strong>Profile</strong> page.';
                    showResult('step4Result', html, 'error');
                } else if (portableBtn && installerBtn) {
                    html += '<strong>Buttons are present on this page!</strong><br>';
                    html += 'If clicking does nothing, check browser console (F12) for errors.';
                    showResult('step4Result', html, 'success');
                } else {
                    showResult('step4Result', html, 'warning');
                }

            } catch (error) {
                log(`Exception: ${error.message}`, 'error');
                showResult('step4Result', 
                    `❌ <strong>ERROR:</strong> ${error.message}`, 
                    'error'
                );
            }
        }

        // Auto-run Step 1 on load
        window.addEventListener('load', () => {
            log('Diagnostic tool loaded', 'info');
            setTimeout(() => {
                log('Auto-running Step 1...', 'info');
                step1();
            }, 500);
        });
    </script>
</body>
</html>
