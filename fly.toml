# Fly.io Deployment Configuration
# FREE TIER: 3 shared VMs, 160GB bandwidth/month
app = "interview-ai-backend"
primary_region = "iad" # Washington DC - change to closest region

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8765"
  CLOUD_MODE = "true"
  HOST = "0.0.0.0"
  PYTHON_ENV = "production"
  AUTO_COACH_ENABLED = "true"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
  
  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  # WebSocket support - critical!
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512  # Increased for OCR/AI processing
