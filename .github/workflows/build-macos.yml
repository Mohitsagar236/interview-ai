name: Build macOS DMG

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build python standalone (if applicable)
        run: |
          node ./scripts/build-python-standalone.js || echo "No standalone build script or it failed; continuing"

      - name: Build mac DMG
        run: npm run build:mac

      - name: Find generated artifacts
        run: ls -la dist || true

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: interview-ai-macos-dmg
          path: |
            dist/*.dmg
            dist/*.zip
