<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#2563eb"/>
  <text x="20" y="38" fill="white" font-family="Arial" font-size="24">Active Interview Session</text>
  
  <!-- Main Content Area -->
  <rect x="0" y="60" width="800" height="440" fill="#f3f4f6"/>
  
  <!-- Interview Transcript -->
  <rect x="20" y="80" width="460" height="400" fill="#ffffff" rx="8"/>
  <text x="40" y="110" fill="#1f2937" font-family="Arial" font-size="14">Interviewer: Tell me about your experience with Python.</text>
  <text x="40" y="150" fill="#4b5563" font-family="Arial" font-size="14">Candidate: I have 5 years of experience working with Python...</text>
  
  <!-- AI Analysis Panel -->
  <rect x="500" y="80" width="280" height="400" fill="#ffffff" rx="8"/>
  <text x="520" y="110" fill="#1f2937" font-family="Arial" font-size="16">Real-time Analysis</text>
  
  <rect x="520" y="130" width="240" height="60" fill="#f3f4f6" rx="4"/>
  <text x="530" y="155" fill="#4b5563" font-family="Arial" font-size="12">Confidence Level: High</text>
  <text x="530" y="175" fill="#4b5563" font-family="Arial" font-size="12">Technical Accuracy: 95%</text>
  
  <!-- Controls -->
  <circle cx="40" cy="450" r="15" fill="#ef4444"/>
  <text x="70" y="455" fill="#1f2937" font-family="Arial" font-size="14">Recording</text>
</svg>