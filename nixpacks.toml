# Nixpacks configuration for Railway deployment

[phases.setup]
nixPkgs = ["python311", "tesseract"]

[phases.install]
cmds = ["pip install -r python/requirements-cloud.txt"]

[phases.build]
cmds = ["echo 'Build completed'"]

[start]
cmd = "python python/server.py"

[variables]
PYTHONUNBUFFERED = "1"
