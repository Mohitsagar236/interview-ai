<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self';" />
  <title>Interview AI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0f19;
      --surface: #111827;
      --surface2: #1a2235;
      --border: #1e293b;
      --text: #e2e8f0;
      --text2: #94a3b8;
      --accent: #10b981;
      --accent2: #059669;
      --red: #f85149;
      --yellow: #d29922;
      --blue: #6366f1;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Title Bar ── */
    .titlebar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      -webkit-app-region: drag;
    }
    .titlebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -.3px;
    }
    .titlebar-logo svg { width: 22px; height: 22px; }
    .titlebar-actions {
      display: flex;
      gap: 8px;
      -webkit-app-region: no-drag;
    }
    .titlebar-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
    }
    .titlebar-btn:hover { background: var(--border); color: var(--text); }
    .titlebar-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .titlebar-btn.primary:hover { background: var(--accent2); }

    /* ── Main Layout ── */
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 240px 1fr;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
    }
    .sidebar-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: .8px;
      padding: 8px 10px 4px;
    }
    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      cursor: pointer;
      transition: all .15s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }
    .sidebar-item:hover { background: var(--surface2); color: var(--text); }
    .sidebar-item.active { background: rgba(16,185,129,.12); color: var(--accent); }
    .sidebar-item svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* ── Content ── */
    .content {
      padding: 28px 32px;
      overflow-y: auto;
    }

    /* ── Status Cards ── */
    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .status-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
    }
    .status-card-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: 8px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.green { background: var(--accent); box-shadow: 0 0 6px rgba(16,185,129,.5); }
    .dot.red   { background: var(--red); }
    .dot.yellow { background: var(--yellow); }
    .dot.pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }

    /* ── Section ── */
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: 14px;
    }

    /* ── Quick Actions ── */
    .actions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }
    .action-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      cursor: pointer;
      transition: all .15s;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .action-card:hover { border-color: var(--accent); background: rgba(16,185,129,.05); }
    .action-icon {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .action-icon svg { width: 18px; height: 18px; color: var(--accent); }
    .action-text { font-size: 13px; font-weight: 600; }
    .action-sub  { font-size: 11px; color: var(--text2); margin-top: 2px; }

    /* ── Keys Table ── */
    .keys-table {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 28px;
    }
    .keys-row {
      display: flex;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      gap: 12px;
    }
    .keys-row:last-child { border-bottom: none; }
    .keys-name { flex: 1; font-weight: 500; }
    .keys-val  { color: var(--text2); font-size: 12px; }
    .tag {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
    }
    .tag.set    { background: rgba(16,185,129,.15); color: var(--accent); }
    .tag.notset { background: rgba(248,81,73,.12); color: var(--red); }

    /* ── Shortcut pills ── */
    kbd {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px 7px;
      font-size: 11px;
      font-family: inherit;
      color: var(--text2);
    }
    .shortcuts-list { display: flex; flex-direction: column; gap: 8px; }
    .shortcut-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text2);
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }
    .shortcut-row:last-child { border-bottom: none; }
    .shortcut-row span:first-child { color: var(--text); }
  </style>
</head>
<body>

  <!-- Title Bar -->
  <div class="titlebar">
    <div class="titlebar-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/>
      </svg>
      Interview AI
    </div>
    <div class="titlebar-actions">
      <button class="titlebar-btn" onclick="openSettings()">⚙ Settings</button>
      <button class="titlebar-btn primary" onclick="showToolbar()">Show Toolbar</button>
    </div>
  </div>

  <div class="main">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-label">App</div>
      <button class="sidebar-item active" onclick="showPage('dashboard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </button>
      <button class="sidebar-item" onclick="openSettings()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
        API Keys
      </button>
      <div class="sidebar-label" style="margin-top:8px;">Help</div>
      <button class="sidebar-item" onclick="showPage('shortcuts')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        Shortcuts
      </button>
    </div>

    <!-- Content -->
    <div class="content" id="content">
      <!-- rendered by JS -->
    </div>
  </div>

<script>
const api = window.electronAPI;

// ── Pages ───────────────────────────────────────────────────────────────────
const pages = {
  dashboard: renderDashboard,
  shortcuts: renderShortcuts,
};

function showPage(name) {
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  event && event.currentTarget && event.currentTarget.classList.add('active');
  (pages[name] || renderDashboard)();
}

// ── Dashboard ───────────────────────────────────────────────────────────────
async function renderDashboard() {
  const content = document.getElementById('content');

  // Fetch status
  let serverPort = null, keys = {}, aiStore = {};
  try { serverPort = await api.invoke('get-server-port'); } catch {}
  try {
    const all = await api.invoke('settings:get-all');
    aiStore = all.ai || {};
    const providers = ['openai','openrouter','anthropic','groq','deepgram','gemini','xai'];
    for (const p of providers) {
      const k = await api.invoke('settings:get-api-key', p);
      if (k) keys[p] = k;
    }
  } catch {}

  const serverRunning = !!serverPort;
  const hasAIKey = !!(keys.openai || keys.openrouter || keys.anthropic || keys.groq || keys.gemini || keys.xai);
  const hasTranscription = !!(keys.deepgram);

  content.innerHTML = `
    <div class="status-grid">
      <div class="status-card">
        <div class="status-card-label">AI Backend</div>
        <div class="status-badge">
          <div class="dot ${serverRunning ? 'green pulse' : 'red'}"></div>
          ${serverRunning ? `Running (port ${serverPort})` : 'Not running'}
        </div>
      </div>
      <div class="status-card">
        <div class="status-card-label">AI Provider</div>
        <div class="status-badge">
          <div class="dot ${hasAIKey ? 'green' : 'yellow'}"></div>
          ${hasAIKey ? (aiStore.provider || 'Configured') : 'No key set'}
        </div>
      </div>
      <div class="status-card">
        <div class="status-card-label">Transcription</div>
        <div class="status-badge">
          <div class="dot ${hasTranscription ? 'green' : 'yellow'}"></div>
          ${hasTranscription ? 'Deepgram ready' : 'No key (using local)'}
        </div>
      </div>
      <div class="status-card">
        <div class="status-card-label">Active Model</div>
        <div class="status-badge">
          <div class="dot ${aiStore.model ? 'green' : 'yellow'}"></div>
          ${aiStore.model || 'openai/gpt-4o-mini'}
        </div>
      </div>
    </div>

    <div class="section-title">Quick Actions</div>
    <div class="actions-grid">
      <div class="action-card" onclick="showToolbar()">
        <div class="action-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="20" height="8" rx="2"/><path d="M6 12h.01M10 12h.01M14 12h.01"/></svg>
        </div>
        <div>
          <div class="action-text">Show Toolbar</div>
          <div class="action-sub">Floating AI overlay</div>
        </div>
      </div>
      <div class="action-card" onclick="openSettings()">
        <div class="action-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
        </div>
        <div>
          <div class="action-text">Settings / API Keys</div>
          <div class="action-sub">Add or change keys</div>
        </div>
      </div>
      <div class="action-card" onclick="restartServer()">
        <div class="action-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </div>
        <div>
          <div class="action-text">Restart Backend</div>
          <div class="action-sub">Reload AI server</div>
        </div>
      </div>
    </div>

    <div class="section-title">API Keys Status</div>
    <div class="keys-table">
      ${[
        ['OpenRouter', 'openrouter', 'Recommended — all models'],
        ['OpenAI', 'openai', 'GPT-4o, GPT-4o-mini'],
        ['Anthropic', 'anthropic', 'Claude models'],
        ['Groq', 'groq', 'Fast open-source models'],
        ['Deepgram', 'deepgram', 'Voice transcription'],
      ].map(([name, id, hint]) => `
        <div class="keys-row">
          <div class="keys-name">${name}</div>
          <div class="keys-val">${hint}</div>
          <span class="tag ${keys[id] ? 'set' : 'notset'}">${keys[id] ? 'SET' : 'NOT SET'}</span>
        </div>
      `).join('')}
    </div>

    ${!hasAIKey ? `
    <div style="background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.2);border-radius:12px;padding:16px 20px;font-size:13px;color:#f85149;margin-bottom:20px;">
      ⚠ No AI key configured. <button onclick="openSettings()" style="background:none;border:none;color:#f85149;text-decoration:underline;cursor:pointer;font-size:13px;">Open Settings</button> to add one.
    </div>` : ''}
  `;
}

// ── Shortcuts ────────────────────────────────────────────────────────────────
function renderShortcuts() {
  document.getElementById('content').innerHTML = `
    <div class="section-title">Keyboard Shortcuts</div>
    <div class="keys-table">
      <div class="shortcuts-list" style="padding:4px 0;">
        ${[
          ['Capture screen + analyze', 'Ctrl + Shift + A'],
          ['Toggle toolbar visibility', 'Ctrl + Shift + H'],
          ['Toggle stealth overlay', 'Ctrl + Shift + S'],
          ['Open settings', 'Ctrl + ,'],
          ['Clear transcript', 'Ctrl + Shift + C'],
        ].map(([label, keys]) => `
          <div class="shortcut-row" style="padding:10px 18px;">
            <span>${label}</span>
            <span>${keys.split('+').map(k => `<kbd>${k.trim()}</kbd>`).join(' + ')}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// ── Actions ──────────────────────────────────────────────────────────────────
function openSettings() {
  api.invoke('settings:open-window');
}
function showToolbar() {
  api.invoke('toggle-toolbar');
}
async function restartServer() {
  const btn = event && event.currentTarget;
  if (btn) { btn.style.opacity = '.5'; btn.style.pointerEvents = 'none'; }
  try { await api.invoke('server-restart'); } catch {}
  setTimeout(() => { renderDashboard(); }, 2000);
}

// ── Init ─────────────────────────────────────────────────────────────────────
renderDashboard();

// Refresh status every 10s
setInterval(() => {
  const active = document.querySelector('.sidebar-item.active');
  if (active && active.textContent.trim() === 'Dashboard') renderDashboard();
}, 10000);
</script>
</body>
</html>
