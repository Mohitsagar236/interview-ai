<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#2563eb"/>
  <text x="20" y="38" fill="white" font-family="Arial" font-size="24">Interview AI Assistant</text>
  
  <!-- Main Content Area -->
  <rect x="0" y="60" width="800" height="440" fill="#f3f4f6"/>
  
  <!-- Sidebar -->
  <rect x="0" y="60" width="200" height="440" fill="#ffffff"/>
  <text x="20" y="100" fill="#1f2937" font-family="Arial" font-size="16">New Interview</text>
  <text x="20" y="140" fill="#6b7280" font-family="Arial" font-size="16">Recent Sessions</text>
  <text x="20" y="180" fill="#6b7280" font-family="Arial" font-size="16">Settings</text>
  
  <!-- Main Content -->
  <rect x="220" y="80" width="560" height="400" fill="#ffffff" rx="8"/>
  <text x="240" y="120" fill="#1f2937" font-family="Arial" font-size="20">Welcome to Interview AI</text>
  <text x="240" y="160" fill="#4b5563" font-family="Arial" font-size="14">Start a new interview session or review past interviews.</text>
  
  <!-- Action Buttons -->
  <rect x="240" y="200" width="200" height="40" fill="#2563eb" rx="6"/>
  <text x="290" y="225" fill="white" font-family="Arial" font-size="14">Start New Interview</text>
  
  <rect x="240" y="260" width="200" height="40" fill="#ffffff" stroke="#2563eb" rx="6"/>
  <text x="290" y="285" fill="#2563eb" font-family="Arial" font-size="14">Open Recent</text>
</svg>