<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#2563eb"/>
  <text x="20" y="38" fill="white" font-family="Arial" font-size="24">Settings</text>
  
  <!-- Main Content Area -->
  <rect x="0" y="60" width="800" height="440" fill="#f3f4f6"/>
  
  <!-- Settings Panel -->
  <rect x="20" y="80" width="760" height="400" fill="#ffffff" rx="8"/>
  
  <!-- Settings Categories -->
  <rect x="40" y="100" width="200" height="40" fill="#f3f4f6" rx="4"/>
  <text x="60" y="125" fill="#1f2937" font-family="Arial" font-size="14">Audio Settings</text>
  
  <rect x="40" y="150" width="200" height="40" fill="#f3f4f6" rx="4"/>
  <text x="60" y="175" fill="#1f2937" font-family="Arial" font-size="14">AI Model Selection</text>
  
  <rect x="40" y="200" width="200" height="40" fill="#f3f4f6" rx="4"/>
  <text x="60" y="225" fill="#1f2937" font-family="Arial" font-size="14">Transcription Settings</text>
  
  <!-- Settings Form -->
  <text x="280" y="125" fill="#1f2937" font-family="Arial" font-size="16">Audio Input Device</text>
  <rect x="280" y="140" width="300" height="30" fill="#f3f4f6" rx="4"/>
  
  <text x="280" y="195" fill="#1f2937" font-family="Arial" font-size="16">Language</text>
  <rect x="280" y="210" width="300" height="30" fill="#f3f4f6" rx="4"/>
  
  <!-- Save Button -->
  <rect x="280" y="400" width="100" height="40" fill="#2563eb" rx="6"/>
  <text x="305" y="425" fill="white" font-family="Arial" font-size="14">Save</text>
</svg>