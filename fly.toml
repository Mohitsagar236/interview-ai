# Fly.io Deployment Configuration
app = "interview-ai-backend"
primary_region = "iad" # Washington DC - change to closest region

[build]
  [build.args]
    PYTHON_VERSION = "3.11"

[env]
  PORT = "8765"
  CLOUD_MODE = "true"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
