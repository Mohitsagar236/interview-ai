name: Release (Windows & Mac)

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Install dependencies
        run: npm install

      - name: Run smoke tests
        run: npm test

      - name: Build Python standalone
        run: npm run build:standalone

      - name: Build Windows installer
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/**

      - name: Locate artifacts
        id: artifacts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Path dist -Include *.exe,*.msi,*.zip | Select-Object -ExpandProperty FullName
          if(-not $files) { throw 'No build artifacts found in dist' }
          echo "files<<EOF" >> $env:GITHUB_OUTPUT
          $files | ForEach-Object { echo $_ >> $env:GITHUB_OUTPUT }
          echo "EOF" >> $env:GITHUB_OUTPUT

  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Install dependencies
        run: npm install

      - name: Run smoke tests
        run: npm test

      - name: Build Python standalone
        run: npm run build:standalone

      - name: Build Mac installer
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: dist/**

      - name: Locate artifacts
        id: artifacts
        shell: bash
        run: |
          files=$(find dist -type f \( -name "*.dmg" -o -name "*.zip" \) 2>/dev/null)
          if [ -z "$files" ]; then
            echo "No build artifacts found in dist"
            exit 1
          fi
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: dist/

      - name: Download Mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-artifacts
          path: dist/

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.exe
            dist/**/*.msi
            dist/**/*.zip
            dist/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
