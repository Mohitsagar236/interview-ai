<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <defs>
        <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#10b981;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#059669;stop-opacity:1"/>
        </linearGradient>
    </defs>
    
    <!-- Background circle -->
    <circle cx="100" cy="100" r="100" fill="url(#greenGradient)"/>
    
    <!-- Microphone body -->
    <path d="M70 80 Q70 55 90 55 L110 55 Q130 55 130 80 L130 110 Q130 135 110 135 L90 135 Q70 135 70 110 Z" fill="white"/>
    
    <!-- Microphone bottom -->
    <circle cx="100" cy="145" r="12" fill="white"/>
    <rect x="94" y="142" width="12" height="22" fill="white" rx="6"/>
    
    <!-- Sound wave lines (left) -->
    <path d="M50 75 L40 65" stroke="white" stroke-width="6" stroke-linecap="round"/>
    <path d="M50 100 L40 100" stroke="white" stroke-width="6" stroke-linecap="round"/>
    <path d="M50 125 L40 135" stroke="white" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Sound wave lines (right) -->
    <path d="M150 75 L160 65" stroke="white" stroke-width="6" stroke-linecap="round"/>
    <path d="M150 100 L160 100" stroke="white" stroke-width="6" stroke-linecap="round"/>
    <path d="M150 125 L160 135" stroke="white" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Microphone grid details -->
    <line x1="80" y1="85" x2="120" y2="85" stroke="#10b981" stroke-width="2.5" opacity="0.3"/>
    <line x1="80" y1="100" x2="120" y2="100" stroke="#10b981" stroke-width="2.5" opacity="0.3"/>
    <line x1="80" y1="115" x2="120" y2="115" stroke="#10b981" stroke-width="2.5" opacity="0.3"/>
</svg>
