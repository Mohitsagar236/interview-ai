    <rect x="47" y="73" width="6" height="12" fill="white" rx="3"/>
    
    <!-- AI wave lines (left) -->
    <path d="M28 40 L23 35" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M28 50 L23 50" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M28 60 L23 65" stroke="white" stroke-width="3" stroke-linecap="round"/>
    
    <!-- AI wave lines (right) -->
    <path d="M72 40 L77 35" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M72 50 L77 50" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M72 60 L77 65" stroke="white" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Microphone grid lines -->
    <line x1="40" y1="45" x2="60" y2="45" stroke="#10b981" stroke-width="1.5" opacity="0.3"/>
    <line x1="40" y1="52" x2="60" y2="52" stroke="#10b981" stroke-width="1.5" opacity="0.3"/>
    <line x1="40" y1="59" x2="60" y2="59" stroke="#10b981" stroke-width="1.5" opacity="0.3"/>
