# Koyeb Deployment Configuration
# This file helps Koyeb understand how to deploy your backend

app:
  name: interview-ai
  
services:
  - name: interview-ai
    # Buildpack deployment (no Docker required)
    build:
      type: buildpack
      buildpack:
        run_command: "python python/start_server.py"
    
    # Service configuration
    instance:
      type: nano  # Free tier (512 MB RAM)
    
    ports:
      - port: 8000
        protocol: http
    
    # Environment variables
    env:
      - name: CLOUD_MODE
        value: "true"
      - name: PORT
        value: "8000"
      - name: HOST
        value: "0.0.0.0"
      - name: ALLOWED_ORIGINS
        value: "*"
      
      # API Keys (IMPORTANT: Set these in Koyeb dashboard for security)
      - name: OPENROUTER_API_KEY
        value: "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"
      - name: OPENAI_BASE_URL
        value: "https://openrouter.ai/api/v1"
      - name: DEFAULT_LLM
        value: "openai/gpt-4o-mini"
      - name: DEEPGRAM_API_KEY
        value: "4bfe6cc554cfdef77f2adc9fc7d3ea140f10b24d"
      
      # Streaming Configuration
      - name: USE_STREAMING_TRANSCRIPTION
        value: "true"
      - name: STREAMING_PROVIDER
        value: "deepgram"
      - name: STREAMING_SAMPLE_RATE
        value: "16000"
      - name: STREAMING_ENCODING
        value: "linear16"
      - name: STREAMING_CHANNELS
        value: "1"
      - name: STREAMING_INTERIM_RESULTS
        value: "false"
      - name: STREAMING_PUNCTUATE
        value: "true"
      - name: STREAMING_SMART_FORMAT
        value: "true"
      - name: STREAMING_LANGUAGE
        value: "en-US"
      - name: STREAMING_MODEL
